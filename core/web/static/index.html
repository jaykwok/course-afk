<!doctype html>
<html lang="zh-CN"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>网上大学 · 本地管理</title><link rel="stylesheet" href="/style.css"><script src="/app.js" defer></script></head>
<body><div class="shell"><aside><div class="brand"><span class="mark">CT</span><div>网上大学<small>本地课程管理</small></div></div><nav aria-label="业务操作"><button data-kind="learn">课程学习 <span>→</span></button><button data-kind="exam">考试 <span>→</span></button><button data-kind="links">添加链接 <span>＋</span></button><button data-kind="references">课程资料 <span>↓</span></button><button data-kind="tasks">任务管理 <span>≡</span></button><button data-kind="account">账号与登录 <span>○</span></button></nav><div class="aside-note">运行于本机<br>资料与凭证保存在本地</div></aside>
<main><header><div><div class="eyebrow">COURSE WORKSPACE</div><h1>总览</h1></div><span id="connection" role="status" class="pill">正在连接</span></header><section class="account panel"><div><small>当前账号</small><h2 id="account">未登录</h2><p id="credential">正在读取登录状态</p></div><div><small>推荐下一步</small><p id="recommended">等待连接</p></div></section>
<section class="metrics" aria-label="待办统计"><article><small>待学习</small><strong id="learning_count">—</strong></article><article><small>失败 / 学习复查</small><strong id="learning_failure_count">—</strong></article><article><small>待考试</small><strong id="exam_count">—</strong></article><article><small>考试复查</small><strong id="manual_exam_count">—</strong></article></section>
<section class="panel running"><div class="section-head"><h2 id="operation-title">运行面板</h2><span id="phase" class="pill">空闲</span></div><p id="status" role="status">等待连接</p><div id="progress-area" hidden><label id="progress-label" for="progress"></label><progress id="progress" max="1" value="0"></progress></div><div class="controls"><button id="stop">本课程结束后停止</button><button id="cancel" class="danger">取消本轮</button><button id="exit">退出程序</button></div><p class="hint">学习可在当前课程结束后停止。考试、链接发现与资料收集请使用“取消本轮”，未确认任务会保留。考试默认不自动交卷。</p></section>
<section id="prompt" class="panel prompt" hidden aria-live="polite"></section><section id="summary" class="panel" hidden></section><section class="panel"><div class="section-head"><h2>进度与日志</h2><small id="log-meta">显示最近 400 条</small></div><div id="logs" role="log" aria-label="活动日志"></div></section><p id="error" role="alert"></p><footer>刷新会恢复当前操作。切换标签或最小化会继续运行；关闭此管理窗口会请求安全停止与退出。</footer></main></div></body></html>
