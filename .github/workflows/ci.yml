name: Node regression
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  regression:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-2025, macos-15]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    env:
      COURSE_AFK_QUIET: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24.22.1"
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npm run build
      - run: npm test
      - run: npm run check-startup
      - run: npm run test:browser
        env:
          COURSE_AFK_BROWSER_TEST: "1"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: workbench-${{ matrix.os }}
          path: build/browser-check/
          if-no-files-found: ignore
