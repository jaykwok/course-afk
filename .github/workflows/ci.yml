name: Cross-platform regression
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  regression:
    name: ${{ matrix.os }} / Python 3.14
    strategy:
      fail-fast: false
      matrix:
        os: [windows-2025, macos-15, macos-15-intel]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    env:
      BROWSER_CHANNEL: ""
      PYTHONUTF8: "1"
      COURSE_AFK_CI: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.14'
      - run: python -m pip install uv
      - run: uv sync --locked
      - run: uv run launcher.py --check-startup
      - run: uv run python -m playwright install chromium
      - run: uv run python tools/run_tests.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: regression-${{ matrix.os }}
          path: build/ci/
          if-no-files-found: error
